x-text-env: &text-env
  PROVIDER_MODE: ollama
  LLM_MODEL: llama3.2:3b
  EMBEDDING_MODEL: nomic-embed-text
  LLM_CONTEXT_TOKENS: '8192'
services:
  api:
    environment: *text-env
  worker:
    environment: *text-env
    depends_on:
      ollama: {condition: service_healthy}
  ollama:
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'ollama show llama3.2:3b >/dev/null && ollama show nomic-embed-text >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
  text-download:
    image: ollama/ollama:0.6.8
    profiles: [model-download]
    networks: [frontend]
    volumes: [ollama_models:/root/.ollama]
    entrypoint: [/bin/sh, /download-text.sh]
    configs:
      - source: download_text
        target: /download-text.sh
    restart: 'no'
configs:
  download_text:
    file: ./docker/download-text.sh
