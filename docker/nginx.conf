worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    # No request URLs, headers, credentials or document content in proxy logs.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    # Nginx initializes these paths even when no FastCGI/uWSGI/SCGI upstream is used.
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 21m;
    client_body_timeout 60s;

    # Re-resolve container names after a backend is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $server_port $backend {
        8003 api:8003;
        8503 ui:8503;
        3003 grafana:3000;
        9093 prometheus:9090;
        default "";
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8003;
        listen 8503;
        listen 3003;
        listen 9093;

        location / {
            # Targets come only from the fixed port map, never user input.
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 300s;
        }
    }
}
