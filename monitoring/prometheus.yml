global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:9100']
  - job_name: dispatcher
    static_configs:
      - targets: ['dispatcher:9102']
  - job_name: workers
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9101
        refresh_interval: 10s
