name: sunday-rag-lab
x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}
x-env: &app-env
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-development}
  DATABASE_URL: postgresql+psycopg://rag_app:${APP_DB_PASSWORD:?Run setup}@db:5432/rag_lab
  REDIS_URL: redis://:${REDIS_PASSWORD:?Run setup}@redis:6379/0
  CREDENTIALS_JSON: ${CREDENTIALS_JSON:?Run setup}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run setup}
  BLOB_DIR: /app/var/blobs
  PARSER_URL: http://parser:8010
  PROVIDER_MODE: ${PROVIDER_MODE:-demo}
  OLLAMA_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"
x-app: &app
  build: {context: ., target: runtime}
  environment: *app-env
  networks: [private]
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  restart: unless-stopped
services:
  gateway:
    image: nginx:1.28-alpine
    user: '101:101'
    entrypoint: [nginx]
    command: ['-g', 'daemon off;']
    networks: [frontend, ingress]
    ports:
      - '127.0.0.1:8003:8003'
      - '127.0.0.1:8503:8503'
      - '127.0.0.1:3003:3003'
      - '127.0.0.1:9093:9093'
    volumes: ['./docker/nginx.conf:/etc/nginx/nginx.conf:ro']
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
    depends_on:
      api: {condition: service_healthy}
      ui: {condition: service_started}
      prometheus: {condition: service_started}
      grafana: {condition: service_started}
    healthcheck:
      test: [CMD, wget, '-q', '-O', /dev/null, 'http://127.0.0.1:8003/health/db']
      interval: 5s
      timeout: 5s
      retries: 20
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: rag_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run setup}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Run setup}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d rag_lab']
      interval: 3s
      timeout: 3s
      retries: 30
    logging: *logging
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run setup}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 3s
      timeout: 3s
      retries: 30
    logging: *logging
  migrate:
    <<: *app
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://rag_migrator:${MIGRATOR_DB_PASSWORD:?Run setup}@db:5432/rag_lab
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    networks: [private, ingress]
    volumes: [blob_data:/app/var/blobs]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/db')"]
      interval: 5s
      timeout: 5s
      retries: 20
  dispatcher:
    <<: *app
    command: [python, -m, rag_lab.queue]
    depends_on:
      api: {condition: service_healthy}
  worker:
    <<: *app
    networks: [private, parser_net]
    command: [python, -m, rag_lab.worker]
    volumes: [blob_data:/app/var/blobs]
    depends_on:
      api: {condition: service_healthy}
      parser: {condition: service_healthy}
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 100
  parser:
    build: {context: ., target: parser}
    networks: [parser_net]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8010/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  ui:
    <<: *app
    networks: [private, ingress]
    environment: {API_URL: 'http://api:8003'}
    command: [streamlit, run, rag_lab/ui/app.py, '--server.address=0.0.0.0', '--server.port=8503']
    depends_on:
      api: {condition: service_healthy}
  ollama:
    image: ollama/ollama:0.6.8
    profiles: [local-models]
    environment: {OLLAMA_NO_CLOUD: '1'}
    volumes: [ollama_models:/root/.ollama]
    networks: [private]
    logging: *logging
  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    networks: [private, ingress]
    logging: *logging
  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_USER: operator
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run setup}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [private, ingress]
    logging: *logging
  test-db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    profiles: [tests]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: rag_lab_test
      POSTGRES_PASSWORD: test-admin
      APP_DB_PASSWORD: test-app
      MIGRATOR_DB_PASSWORD: test-migrator
    networks: [private]
    tmpfs: [/var/lib/postgresql]
    volumes: ['./docker/init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d rag_lab_test']
      interval: 3s
      timeout: 3s
      retries: 30
  tests:
    build: {context: ., target: tests}
    profiles: [tests]
    networks: [private]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://rag_app:test-app@test-db:5432/rag_lab_test
      TEST_REDIS_URL: redis://test-redis:6379/15
      MIGRATION_DATABASE_URL: postgresql+psycopg://rag_migrator:test-migrator@test-db:5432/rag_lab_test
      TIKTOKEN_CACHE_DIR: /app/tokenizer-cache
    command: [sh, -c, 'alembic upgrade head && pytest -q -p no:cacheprovider']
    depends_on:
      test-db: {condition: service_healthy}
      test-redis: {condition: service_healthy}
  test-redis:
    image: redis:7.4-alpine
    profiles: [tests]
    networks: [private]
    command: [redis-server, '--save', '', '--appendonly', 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
networks:
  frontend:
    driver: bridge
  ingress:
    internal: true
  private:
    internal: true
  parser_net:
    internal: true
volumes:
  postgres_data:
  redis_data:
  blob_data:
  prometheus_data:
  grafana_data:
  ollama_models:

